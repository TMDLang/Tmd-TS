name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run build
      - run: npm run eslint
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Record coverage summary
        if: always()
        run: |
          node -e '
            const fs = require("node:fs");
            const summaryPath = "coverage/coverage-summary.json";
            if (!fs.existsSync(summaryPath) || !process.env.GITHUB_STEP_SUMMARY) process.exit(0);
            const { total } = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
            const fmt = (m) => `${m.pct.toFixed(2)}% (${m.covered}/${m.total})`;
            const md = [
              "### 📊 Test Coverage Summary",
              "",
              "| Metric | Coverage |",
              "| :--- | ---: |",
              `| **Statements** | ${fmt(total.statements)} |`,
              `| **Branches** | ${fmt(total.branches)} |`,
              `| **Functions** | ${fmt(total.functions)} |`,
              `| **Lines** | ${fmt(total.lines)} |`,
              ""
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          '
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
      - run: node -e "const { TmdParser } = require('./dist'); const sheet = TmdParser.parse('::SCORE::\\n** CI **\\n!=120\\n?=C\\n<4/4>\\nintro:Piano@|0|{\\n<4*>\\n1 2 3 4\\n}\\n-> intro ->#'); if (sheet.name !== 'CI') process.exit(1)"

  package:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'
