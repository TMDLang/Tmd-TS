name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run build
      - run: npm test
      - run: node -e "const { TmdParser } = require('./dist'); const sheet = TmdParser.parse('::SCORE::\\n** CI **\\n!=120\\n?=C\\n<4/4>\\nintro:Piano@|0|{\\n<4*>\\n1 2 3 4\\n}\\n-> intro ->#'); if (sheet.name !== 'CI') process.exit(1)"

  package:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'
